
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142c52">
  <title>تسجيل الدخول | EGNS Smart Campus</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { background:#f5efe4; margin:0; font-family:Arial,sans-serif; }
    .login-wrap { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login-card { background:white; width:100%; max-width:440px; padding:30px; border-radius:20px; box-shadow:0 12px 40px #142c5218; }
    .login-card h1 { color:#142c52; margin:0 0 8px; }
    .login-card p { color:#666; line-height:1.8; }
    .tabs { display:flex; gap:8px; margin:22px 0; }
    .tabs button { flex:1; padding:12px 8px; border:1px solid #ddd; border-radius:10px; background:white; cursor:pointer; }
    .tabs button.active { background:#142c52; color:white; }
    .field { margin:16px 0; }
    .field label { display:block; margin-bottom:8px; font-weight:bold; }
    .field input { box-sizing:border-box; width:100%; padding:13px; border:1px solid #d6d6d6; border-radius:10px; font-size:16px; }
    .submit { width:100%; padding:14px; background:#142c52; color:white; border:0; border-radius:10px; font-size:16px; cursor:pointer; }
    .submit:disabled { opacity:.6; cursor:wait; }
    .message { margin-top:14px; padding:12px; border-radius:10px; display:none; line-height:1.7; }
    .message.error { display:block; background:#fff0f0; color:#9b1c1c; }
    .message.info { display:block; background:#eef5ff; color:#142c52; }
    .back { display:inline-block; margin-top:18px; color:#142c52; }
    .small { font-size:13px; }
  </style>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <h1>EGNS Smart Campus</h1>
      <p>بوابتك الرقمية للمدرسة المصرية الألمانية الثانوية الفنية للتمريض.</p>

      <div class="tabs">
        <button type="button" id="adminTab" class="active">الإدارة</button>
        <button type="button" id="userTab">الطلاب والموظفون</button>
      </div>

      <form id="loginForm">
        <div class="field" id="emailField">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="username"
                 placeholder="name@egns.com">
        </div>

        <div class="field" id="codeField" hidden>
          <label for="schoolCode">الكود المدرسي</label>
          <input id="schoolCode" type="text" autocomplete="username"
                 placeholder="أدخل الكود المدرسي">
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" autocomplete="current-password"
                 required minlength="6" placeholder="أدخل كلمة المرور">
        </div>

        <button class="submit" id="submitButton" type="submit">تسجيل الدخول</button>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>

      <p class="small">الحسابات تصدرها إدارة المدرسة. لا يوجد تسجيل حسابات عام.</p>
      <a class="back" href="index.html">العودة إلى الصفحة الرئيسية</a>
    </section>
  </main>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
