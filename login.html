<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول | EGNS Smart Campus</title>
  <link rel="stylesheet" href="assets/css/student.css">
  <script type="module" src="assets/js/login.js"></script>
</head>
<body>
  <main class="main-area" style="max-width:540px;margin:auto">
    <section class="welcome-banner">
      <h2>EGNS Smart Campus</h2>
      <p>بوابة المدرسة المصرية الألمانية للتمريض</p>
    </section>

    <section class="panel">
      <h1 class="page-heading">تسجيل الدخول</h1>
      <p class="page-subtitle">اكتب البريد الإلكتروني أو كود الحساب وكلمة المرور.</p>

      <form id="loginForm" style="display:grid;gap:14px;margin-top:22px">
        <label class="profile-field">البريد الإلكتروني أو كود الحساب
          <input name="identifier" required autocomplete="username"
            placeholder="كود الحساب أو البريد الإلكتروني">
        </label>

        <label class="profile-field">كلمة المرور
          <input name="password" type="password" required
            autocomplete="current-password">
        </label>

        <button class="btn" type="submit">دخول</button>
      </form>

      <div id="loginMessage" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
