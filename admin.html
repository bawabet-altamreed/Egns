<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الإدارة | EGNS Smart Campus</title>
  <link rel="stylesheet" href="assets/css/student.css">
  <script type="module" src="assets/js/admin.js"></script>
</head>
<body>
  <main class="main-area">
    <header class="topbar">
      <div>
        <h1 class="page-heading">EGNS Smart Campus</h1>
        <p class="page-subtitle">لوحة إدارة المدرسة</p>
      </div>
      <button id="adminLogout" class="btn btn-red">تسجيل الخروج</button>
    </header>

    <section class="welcome-banner">
      <h2>مركز إدارة المدرسة</h2>
      <p>إدارة الحسابات والفصول والمواد والإعلانات والجداول والامتحانات من مكان واحد.</p>
    </section>

    <section class="panel">
      <div class="panel-heading"><div>
        <h2>إنشاء حساب جديد</h2>
        <p>طالب أو معلم أو موظف أو إداري</p>
      </div></div>

      <form id="accountForm" class="profile-list">
        <label class="profile-field">الاسم الكامل
          <input name="name" required maxlength="100" placeholder="الاسم بالكامل">
        </label>
        <label class="profile-field">كود الدخول
          <input name="loginCode" required minlength="3" maxlength="64"
            pattern="[A-Za-z0-9._-]+" placeholder="مثال: std1001">
        </label>
        <label class="profile-field">كلمة المرور المؤقتة
          <input name="password" type="password" required minlength="6"
            autocomplete="new-password">
        </label>
        <label class="profile-field">نوع الحساب
          <select name="role" required>
            <option value="student">طالب</option>
            <option value="teacher">معلم</option>
            <option value="employee">موظف</option>
            <option value="student_affairs">شؤون طلاب</option>
            <option value="exams_affairs">شؤون امتحانات</option>
          </select>
        </label>
        <label class="profile-field">المرحلة الدراسية
          <select name="stage">
            <option value="">غير محددة</option>
            <option>الأول الثانوي التمريض</option>
            <option>الثاني الثانوي التمريض</option>
            <option>الثالث الثانوي التمريض</option>
            <option>الأول معهد</option>
            <option>الثاني معهد</option>
          </select>
        </label>
        <label class="profile-field">الفصل / كود الفصل
          <input name="classId" placeholder="مثال: class-1a">
        </label>
        <label class="profile-field">اسم الفصل
          <input name="className" placeholder="مثال: 2/أ">
        </label>
        <div class="profile-field">
          <button class="btn" type="submit">إنشاء الحساب</button>
        </div>
      </form>
      <div id="accountMessage" aria-live="polite"></div>
    </section>

    <section class="panel">
      <div class="panel-heading"><div>
        <h2>إدارة بيانات النظام</h2>
        <p>اختر مجموعة، ثم أضف مستندًا أو عدّل مستندًا موجودًا بصيغة JSON.</p>
      </div></div>

      <div class="profile-list">
        <label class="profile-field">مجموعة البيانات
          <select id="collectionSelect">
            <option value="users">الحسابات users</option>
            <option value="classes">الفصول classes</option>
            <option value="subjects">المواد subjects</option>
            <option value="announcements">الإعلانات announcements</option>
            <option value="timetables">الجداول timetables</option>
            <option value="exams">الامتحانات exams</option>
            <option value="examKeys">مفاتيح الإجابات examKeys</option>
            <option value="examAttempts">محاولات الامتحان examAttempts</option>
            <option value="badges">الشارات badges</option>
            <option value="leaderboard">لوحة الشرف leaderboard</option>
          </select>
        </label>
        <label class="profile-field">معرّف المستند
          <input id="documentId" placeholder="اتركه فارغًا لإنشاء معرّف تلقائي">
        </label>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:15px 0">
        <button id="loadRecords" class="btn" type="button">تحميل السجلات</button>
        <button id="newRecord" class="btn btn-light" type="button">مستند جديد</button>
        <button id="saveRecord" class="btn" type="button">حفظ المستند</button>
        <button id="deleteRecord" class="btn btn-red" type="button">حذف المستند</button>
      </div>

      <label class="profile-field">محتوى المستند (JSON)
        <textarea id="recordJson" rows="12" spellcheck="false"
          style="width:100%;direction:ltr;text-align:left;font-family:monospace"
          placeholder='{"title":"مثال","active":true}'></textarea>
      </label>

      <div id="recordMessage" aria-live="polite"></div>
      <div id="recordsList" class="cards-grid" style="margin-top:16px"></div>
    </section>
  </main>
</body>
</html>
